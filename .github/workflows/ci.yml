name: Devos Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'api/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'api/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d devos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
  
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Run Prisma Migrations
        run: pnpm --filter api exec prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/devos?schema=public"

      - name: Run Unit Tests
        run: pnpm --filter api run test

      - name: Run E2E Tests
        run: pnpm --filter api run test:e2e
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/devos?schema=public"
          JWT_SECRET: "super-secret-ci-key"
          JWT_EXPIRES: "1h"

      - name: Build Docker Image
        run: docker build -t devos-api-test .