<article class="flex justify-between items-center max-w-6xl mx-auto w-full gap-10">
  <div>
    <h2 class="text-2xl text-amber-200">Resolution of technical doubts</h2>
    <span class="text-purple-600">StackOverflow Style</span>
  </div>
  <div class="bg-zinc-900 px-4 flex-1 p-2 mr-10 text-center rounded-2xl">
    <div class="flex justify-center gap-8">
      <img
        src="https://avatars.githubusercontent.com/u/277286653?s=400&u=c0b7f9e6edf6d771b620de36f3ac9b11481865cb&v=4"
        alt="profile"
        class="w-8 h-8 my-3 rounded-full"
      />
      <div>
        <ul class="flex flex-col items-center mb-1">
          <li class="bg-purple-600 w-fit px-3 py-1 rounded-2xl text-white font-bold">javascript</li>
        </ul>
        <h3 class="text-center text-purple-600 font-bold text-xl">Null is object??</h3>
        <p class="text-zinc-400">Why this returns object, is my console broken?</p>
        <pre>
            <code [highlight]="'console.log(typeof null) // object'" language="javascript" class="font-mono rounded-2xl">
            </code>
          </pre>
      </div>
    </div>
  </div>
</article>
