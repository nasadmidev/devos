<section
  class="flex w-[90%] mx-auto bg-zinc-900 p-4 rounded-2xl mt-6 gap-1 justify-between items-center relative"
>
  <div class="flex flex-col ml-5">
    <form class="flex flex-col ml-5" [formRoot]="loginForm" method="post">
      <h1 class="text-center text-2xl text-purple-600">Login</h1>
      <label for="email" class="font-bold text-zinc-500 mb-2">Email</label>
      <input
        type="email"
        id="email"
        [formField]="loginForm.email"
        class="bg-zinc-700 outline-none rounded-2xl text-amber-200 py-1 px-3 w-100 font-bold mb-2"
      />
      <label for="password" class="font-bold text-zinc-500 mb-2">Password</label>
      <input
        type="password"
        id="password"
        [formField]="loginForm.password"
        class="bg-zinc-700 outline-none rounded-2xl text-amber-200 py-1 px-3 w-100 mb-2"
        autocomplete="off"
        autocorrect="off"
        aria-autocomplete="none"
      />
      <input
        type="submit"
        value="python3 login.py"
        class="cursor-pointer p-2 bg-purple-900 rounded-2xl mt-2 text-amber-200 font-bold"
      />
    </form>
    <app-oauth [styles]="'flex flex-col items-center justify-center mt-10 gap-4'"></app-oauth>
  </div>
  <div class="">
    <pre class="w-full max-w-3xl mx-auto">
      <code
      [highlight]="
      `import requests
response = requests.post('https://api.com/auth/login', json={
    'email': '${loginForm().value().email}',
    'password': '${'·'.repeat(loginForm().value().password.length)}'
})
token = response.json().get('accessToken')
print(f'🔑 Session initialized. Token: {token[:10]}...')`" language="python" class="font-mono rounded-2xl mt-9 w-fit text-sm">
      </code>
    </pre>
    <app-terminal [value]="getConsoleErrorMessage()" class=""></app-terminal>
  </div>
</section>
